[project]
name = "graduation-thesis"
version = "0.1.0"
description = "Import price shock, income outflow, and household consumption in Japan"
requires-python = ">=3.11"
dependencies = [
    # Data manipulation
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",          # Excel IO (IO table files)
    "xlrd>=2.0",              # Legacy Excel format support

    # Linear algebra / statistics
    "scipy>=1.10",
    "statsmodels>=0.14",
    "linearmodels>=6.0",         # Panel OLS with cluster SE

    # Visualization
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "japanize-matplotlib>=1.1",  # Japanese font support

    # HTTP / data fetching
    "requests>=2.28",
    "httpx>=0.24",

    # Jupyter
    "jupyter>=1.0",
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
